<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevShop ~ HollowTech</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- nav bar : logo + toggle theme+ compteur -->
    <header class="navbar">
        <div class="logo">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 2L3 6V20C3 20.53 3.21 21.04 3.59 21.41C3.96 21.79 4.47 22 5 22H19C19.53 22 20.04 21.79 20.41 21.41C20.79 21.04 21 20.53 21 20V6L18 2H6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M16 10C16 11.06 15.58 12.08 14.83 12.83C14.08 13.58 13.06 14 12 14C10.94 14 9.92 13.58 9.17 12.83C8.42 12.08 8 11.06 8 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h1>DevShop</h1>
        </div>

        <div class="navbar-actions">
            <!-- bouton pour basculer entre thème clair et sombre -->
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Changer de theme">
                <svg id="icon-sun" class="theme-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 2V4M12 20V22M4 12H2M22 12H20M19.07 4.93L17.66 6.34M6.34 17.66L4.93 19.07M19.07 19.07L17.66 17.66M6.34 6.34L4.93 4.93" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <svg id="icon-moon" class="theme-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 12.79C20.9265 13.98 20.4838 15.1163 19.7322 16.0432C18.9806 16.9701 17.9575 17.641 16.8054 17.9615C15.6533 18.2819 14.4291 18.2364 13.3038 17.8312C12.1786 17.426 11.2075 16.6811 10.5271 15.7007C9.84667 14.7203 9.49034 13.552 9.51574 12.3607C9.54113 11.1694 9.94706 10.0169 10.6693 9.06527C11.3915 8.11363 12.3944 7.41077 13.537 7.05513C14.6797 6.6995 15.9058 6.70951 17.042 7.08376C16.2069 7.44684 15.4954 8.04437 14.9945 8.80299C14.4936 9.56162 14.2254 10.4488 14.2224 11.3563C14.2194 12.2638 14.4817 13.1527 14.9776 13.9146C15.4735 14.6765 16.181 15.2786 17.014 15.6473C17.847 16.016 18.7695 16.1352 19.6693 15.99C20.5691 15.8447 21.407 15.4416 22.08 14.83C21.9028 15.6178 21.5645 16.3603 21.086 17.011L21 12.79Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <!-- icone panier avec compteur -->
            <div class="cart-icon" id="cart-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 3H5L5.4 5M5.4 5H21L19 13H7M5.4 5L7 13M7 13L5.62 17.16C5.42 17.78 5.88 18.4 6.53 18.4H18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="9" cy="21" r="1.3" stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="18" cy="21" r="1.3" stroke="currentColor" stroke-width="1.6"/>
                </svg>
                <span id="cart-count" class="cart-count">0</span>
                <!-- le compteur sera incrémenté en JS -->
            </div>
        </div>
    </header>

    <!-- search bar + filters -->
    <section class="controls">
        <h2 class="sr-only">Recherche et filtres</h2>
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input type="text" id="search-input" placeholder="Rechercher un produit ...">
            <button id="search-clear" class="search-clear" type="button" aria-label="Effacer la recherche">&times;</button>
        </div>

        <div class="category-filters" id="category-filters">
            <!-- les buttons de catégorie seront injectés par le JS -->
        </div>
    </section>

    <!-- zone pour la Gestion des états (UX) : Loader pendant le fetch / Error message si échec -->
    <div id="status-message"></div>

    <!-- grille de products -->
    <main class="products-grid" id="products-grid">
        <!-- les card seront injectés par le JS -->
    </main>

    <!-- Bouton pour remonter tout en haut de la page, caché par defaut -->
    <button id="back-to-top" class="back-to-top" type="button" aria-label="Remonter en haut">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <!-- Fond assombri derrière le tiroir, ferme le panier au clic -->
    <div class="cart-overlay" id="cart-overlay"></div>

    <!-- Tiroir Panier (Off-canvas) -->
    <aside class="cart-drawer" id="cart-drawer">
        <div class="cart-drawer-header">
            <h2>Votre panier</h2>
            <button id="cart-close" class="cart-close" type="button" aria-label="Fermer le panier">&times;</button>
        </div>
        <div class="cart-drawer-items" id="cart-drawer-items">
            <!-- les articles du panier seront injectés ici en JS -->
        </div>
        <div class="cart-drawer-footer">
            <p class="cart-total">Total : <span id="cart-total">0</span> €</p>
        </div>
    </aside>

    <!-- conteneur des notifications toast, en bas à droite -->
    <div class="toast-container" id="toast-container"></div>

    <script src="js/script.js"></script>
</body>
</html>
