<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevShop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- nav bar : logo + compteur -->
    <header class="navbar">
        <h1 class="logo">DevShop</h1>
        
        <div class="cart-icon">
            Panier (<span id="cart-count">0</span>)
            <!-- le compteur sera incrémenté en JS -->
        </div>
    </header>

    <!-- search bar + filters -->
    <section class="controls">
        <div class="search-wrapper">
            <input type="text" id="search-input" placeholder="Rechercher un produit ...">
            <button id="search-clear" class="search-clear" type="button">&times;</button>
            <!-- "&times;" est un caractère spécial HTML qui affiche une croix 'x' -->
        </div>
        
        <div class="category-filters" id="category-filters">
            <!-- les buttons de catégorie seront injectés par le JS -->
        </div>
    </section>

    <!-- zone pour la Gestion des états (UX) : Loader pendant le fetch / Error message si échec -->
    <div id="status-message"></div>

    <!-- grille de products -->
    <main class="products-grid" id="products-grid">
        <!-- les card seront injectés par le JS -->
    </main>

    <!-- Bouton pour remonter tout en haut de la page, caché par defaut -->
    <button id="back-to-top" class="back-to-top" type="button" aria-label="Remonter en haut">↑</button>

    <script src="js/script.js"></script>
</body>
</html>
